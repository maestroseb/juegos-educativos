<style>
  :root {
    --bg1: #1b1035;
    --bg2: #2d1b5e;
    --panel: rgba(32, 20, 70, 0.9);
    --edge: #6d55c9;
    --text: #fff;
    --muted: #cbbcff;
    --accent: #ffd23f;
    --good: #5cdb5c;
    --bad: #ff5c7a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: 'Fredoka', system-ui, sans-serif; color: var(--text); user-select: none; -webkit-user-select: none;
    background:
      radial-gradient(circle at 15% 10%, #3b2a7a 0, transparent 40%),
      radial-gradient(circle at 85% 95%, #14506b 0, transparent 45%),
      linear-gradient(160deg, var(--bg1), var(--bg2));
  }
  .screen { position: fixed; inset: 0; display: flex; flex-direction: column; }
  .hidden { display: none !important; }
  button { font-family: inherit; cursor: pointer; border: none; }
  .back { position: absolute; top: 12px; left: 14px; color: var(--muted); text-decoration: none; font-weight: 600; z-index: 5; }

  /* ---------- MENÚ ---------- */
  #menu { align-items: center; overflow-y: auto; padding: 50px 16px 30px; touch-action: pan-y; }
  #menu h1 { font-family: 'Bangers', cursive; font-size: clamp(42px, 8vw, 76px); letter-spacing: 3px; color: var(--accent);
    text-shadow: 0 4px 0 #b3541e, 0 8px 18px rgba(0,0,0,.5); text-align: center; line-height: 1; }
  #menu .sub { color: var(--muted); margin: 8px 0 22px; text-align: center; font-size: 18px; }
  .menu-label { font-weight: 700; margin: 6px 0 10px; font-size: 18px; }
  .ranges { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-bottom: 22px; }
  .range { background: var(--panel); color: var(--text); border: 3px solid var(--edge); border-radius: 16px; padding: 10px 18px; font-size: 19px; font-weight: 700; }
  .range.on { background: var(--accent); color: #3a2200; border-color: #fff3b0; transform: translateY(-2px); box-shadow: 0 6px 0 #b3851e; }
  .games { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 16px; width: min(960px, 100%); }
  .gcard { background: var(--panel); border: 3px solid var(--edge); border-radius: 22px; padding: 18px; color: var(--text); text-align: left; transition: transform .15s; }
  .gcard:hover { transform: translateY(-4px) rotate(-.5deg); border-color: var(--accent); }
  .gcard .pic { height: 92px; display: flex; align-items: center; justify-content: center; margin-bottom: 8px; }
  .gcard h2 { font-family: 'Bangers', cursive; letter-spacing: 1.5px; font-size: 30px; color: var(--accent); }
  .gcard p { color: var(--muted); font-size: 16px; line-height: 1.3; margin-top: 4px; }

  /* ---------- JUEGO ---------- */
  .hud { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: rgba(0,0,0,.25); }
  .hud .btn-sm { background: var(--panel); color: var(--text); border: 2px solid var(--edge); border-radius: 12px; padding: 6px 12px; font-size: 17px; font-weight: 700; }
  .hud .title { font-family: 'Bangers', cursive; font-size: 26px; letter-spacing: 1.5px; color: var(--accent); }
  .dots { display: flex; gap: 6px; margin-left: auto; }
  .dots i { width: 14px; height: 14px; border-radius: 50%; background: rgba(255,255,255,.18); }
  .dots i.done { background: var(--good); }
  .dots i.now { background: var(--accent); box-shadow: 0 0 10px var(--accent); }
  #prompt { text-align: center; font-size: clamp(20px, 3.4vw, 32px); font-weight: 600; padding: 12px 12px 4px; min-height: 52px; }
  #prompt b { color: var(--accent); font-size: 1.2em; }
  #board { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; padding: 4px 10px; min-height: 8px; }
  .chip { min-width: 74px; padding: 6px 12px; border-radius: 14px; background: rgba(255,255,255,.08); border: 2px dashed rgba(255,255,255,.3);
    font-size: 22px; font-weight: 700; text-align: center; color: rgba(255,255,255,.4); }
  .chip.ok { background: var(--good); color: #0d3a0d; border: 2px solid #b8ffb8; animation: pop .4s; }
  #stage { position: relative; flex: 1; overflow: hidden; touch-action: none; }
  #trail { position: absolute; inset: 0; pointer-events: none; z-index: 20; }
  #msg { text-align: center; min-height: 54px; font-size: clamp(20px, 3.2vw, 30px); font-weight: 700; padding: 6px 12px; }
  #msg.good { color: var(--good); } #msg.bad { color: var(--bad); }
  #msg .eq { display: inline-block; background: rgba(255,255,255,.1); border-radius: 14px; padding: 2px 14px; margin: 0 6px; color: #fff; }
  #controls { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; padding: 0 12px 16px; min-height: 20px; }
  .opt { min-width: 76px; padding: 12px 18px; font-size: 32px; font-weight: 700; border-radius: 18px; background: #fff; color: #3b2a7a; box-shadow: 0 6px 0 #a99be0; }
  .opt:active { transform: translateY(4px); box-shadow: 0 2px 0 #a99be0; }
  .opt:disabled { opacity: .35; }
  .hint { background: var(--panel); color: var(--accent); border: 2px solid var(--accent); border-radius: 14px; padding: 8px 16px; font-size: 18px; font-weight: 700; }

  /* ---------- Monstruo gusano (cortar) ---------- */
  .worm { position: absolute; display: flex; align-items: flex-end; padding-left: calc(var(--s) * .15);
    transition: transform .45s cubic-bezier(.25,1.5,.5,1), rotate .45s cubic-bezier(.25,1.5,.5,1); }
  .worm.fly { transition: transform .32s cubic-bezier(.1,.8,.3,1), rotate .32s ease-out; }
  .seg { position: relative; width: var(--s); height: calc(var(--s) * 1.12); margin-left: calc(var(--s) * -.26); border-radius: 50% 50% 44% 44%;
    background: radial-gradient(circle at 38% 28%, rgba(255,255,255,.45), transparent 42%), radial-gradient(circle at 50% 120%, rgba(0,0,0,.28), transparent 60%), var(--c);
    box-shadow: calc(var(--s) * .05) 0 0 rgba(0,0,0,.12); animation: crawl 1.4s ease-in-out infinite; transform-origin: 50% 100%; }
  .seg:first-child { margin-left: 0; }
  .seg.alt { filter: brightness(.82) saturate(1.25); }
  .seg::after { content: ''; position: absolute; bottom: calc(var(--s) * -.1); left: 30%; width: 40%; height: calc(var(--s) * .2); border-radius: 50%; background: rgba(0,0,0,.45); z-index: -1; }
  .seg.head { width: calc(var(--s) * 1.25); height: calc(var(--s) * 1.4); }
  .seg.head::before { content: ''; position: absolute; top: calc(var(--s) * -.3); left: 14%; width: 72%; height: calc(var(--s) * .44);
    background: radial-gradient(circle at 12% 60%, var(--c) 28%, transparent 31%), radial-gradient(circle at 88% 60%, var(--c) 28%, transparent 31%); }
  .seg.tail { border-radius: 50% 60% 44% 50%; }
  .seg.hl { box-shadow: 0 0 0 4px var(--accent), 0 0 18px var(--accent); }
  .eye { position: absolute; top: 20%; width: 32%; height: 32%; background: #fff; border-radius: 50%; overflow: hidden; box-shadow: inset 0 -2px 0 rgba(0,0,0,.15); transition: transform .08s; }
  .eye b { position: absolute; width: 52%; height: 52%; left: 24%; top: 24%; background: #1a1030; border-radius: 50%;
    transform: translate(var(--px, 0), var(--py, 0)); transition: transform .12s ease-out; }
  .eye b::after { content: ''; position: absolute; width: 35%; height: 35%; left: 18%; top: 15%; background: #fff; border-radius: 50%; }
  .eye.l { left: 12%; } .eye.r { left: 54%; }
  .blink .eye { transform: scaleY(.1); }
  .mouth { position: absolute; bottom: 18%; left: 24%; width: 50%; height: 20%; background: #3a0d1c; border-radius: 0 0 40px 40px; transition: all .15s; }
  .mouth::before { content: ''; position: absolute; left: 20%; top: 0; width: 18%; height: 45%; background: #fff; clip-path: polygon(0 0, 100% 0, 50% 100%); }
  .surprised .mouth { left: 36%; width: 28%; height: 26%; border-radius: 50%; }
  .surprised .eye { transform: scale(1.15); }
  .badge { position: absolute; left: 50%; top: -52px; transform: translateX(-50%); background: #fff; color: #2d1b5e; font-weight: 700;
    font-size: 30px; min-width: 48px; text-align: center; padding: 0 10px; border-radius: 16px; box-shadow: 0 4px 0 rgba(0,0,0,.3); }
  .cutline { position: absolute; width: 0; border-left: 4px dashed var(--accent); animation: blink .8s infinite; }

  /* ---------- Monstruo bola (glotones) ---------- */
  .blob { --open: 0; position: absolute; padding: 62px 12px 14px; border-radius: 48% 48% 34% 34%; touch-action: none; cursor: grab;
    background: radial-gradient(circle at 35% 22%, rgba(255,255,255,.4), transparent 40%), var(--c);
    box-shadow: inset 0 -10px 0 rgba(0,0,0,.18), 0 10px 0 -4px rgba(0,0,0,.25); animation: bob 2.4s ease-in-out infinite;
    rotate: var(--lean, 0deg); transition: rotate .2s, box-shadow .2s, filter .2s; transform-origin: 50% 100%; }
  .blob.drag { cursor: grabbing; z-index: 30; animation: none; scale: 1.1; box-shadow: inset 0 -10px 0 rgba(0,0,0,.18), 0 26px 22px -6px rgba(0,0,0,.45); transition: box-shadow .2s, filter .2s; }
  .blob.hungry { z-index: 25; animation: drool .5s ease-in-out infinite; }
  .blob .eye { top: 6px; width: 26px; height: 26px; }
  .blob .eye.l { left: calc(50% - 29px); } .blob .eye.r { left: calc(50% + 3px); }
  .blob.hungry .eye { transform: scale(1.18); }
  .bmouth { position: absolute; left: 50%; top: 36px; z-index: 2; width: calc(30px + var(--open) * 36px); height: calc(8px + var(--open) * 46px);
    transform: translateX(-50%); background: #3a0d1c; border-radius: 6px 6px 50% 50% / 6px 6px 60% 60%; overflow: hidden; transition: width .12s, height .12s;
    box-shadow: 0 0 0 3px rgba(0,0,0,.15); }
  .bmouth::before { content: ''; position: absolute; left: 8%; right: 8%; top: 0; height: calc(4px + var(--open) * 9px); background:
    linear-gradient(135deg, #fff 50%, transparent 50%) 0 0 / calc(8px + var(--open) * 6px) 100%, linear-gradient(225deg, #fff 50%, transparent 50%) 0 0 / calc(8px + var(--open) * 6px) 100%; }
  .bmouth b { position: absolute; left: 50%; bottom: -30%; width: 70%; height: 60%; transform: translateX(-50%); background: #ff6f91; border-radius: 50%; }
  .blob.scared .bmouth { width: 16px; height: 16px; border-radius: 50%; }
  .sweat { position: absolute; right: 6px; top: 8px; width: 10px; height: 14px; background: #9be7ff; border-radius: 50% 0 50% 50%; rotate: 45deg; opacity: 0; transition: opacity .2s; }
  .blob.scared .sweat { opacity: 1; animation: blink .6s infinite; }
  .blob.chew { animation: chew .18s ease-in-out 4; }
  .blob.yuck { filter: hue-rotate(70deg) saturate(.7); }
  .blob.yuck .bmouth { width: 34px; height: 10px; border-radius: 4px; }
  .bubble { position: absolute; z-index: 40; background: #fff; color: #2d1b5e; font-weight: 700; font-size: 22px; padding: 4px 12px; border-radius: 16px;
    transform: translate(-50%, -100%); white-space: nowrap; animation: bubble 1.1s ease-out forwards; pointer-events: none; }
  .bubble::after { content: ''; position: absolute; left: 50%; bottom: -8px; border: 8px solid transparent; border-top-color: #fff; border-bottom: 0; transform: translateX(-50%); }
  .blob::before, .blob::after { content: ''; position: absolute; top: -10px; width: 14px; height: 18px; background: var(--c); border-radius: 50% 50% 20% 20%; }
  .blob::before { left: 14%; transform: rotate(-20deg); } .blob::after { right: 14%; transform: rotate(20deg); }
  .dotgrid { display: grid; grid-template-columns: repeat(5, var(--d)); gap: 4px; justify-content: center; }
  .dotgrid i { width: var(--d); height: var(--d); border-radius: 50%; background: rgba(255,255,255,.92); box-shadow: inset 0 -2px 0 rgba(0,0,0,.2); }
  .blob .num { position: absolute; bottom: -30px; left: 50%; transform: translateX(-50%); background: #fff; color: #2d1b5e; font-weight: 700; font-size: 24px;
    padding: 0 10px; border-radius: 12px; box-shadow: 0 3px 0 rgba(0,0,0,.3); }
  .blob.shake { animation: shake .45s; }
  .blob.happy { animation: pop .5s; }

  /* ---------- Saltos ---------- */
  .nline { position: absolute; height: 6px; background: #fff; border-radius: 3px; }
  .tick { position: absolute; width: 4px; height: 20px; margin-left: -2px; background: #fff; border-radius: 2px; }
  .tick.ten { height: 30px; background: var(--accent); }
  .tlabel { position: absolute; transform: translateX(-50%); font-weight: 700; font-size: 20px; color: var(--muted); }
  .tlabel.ten { color: var(--accent); font-size: 24px; }
  .tlabel.from { color: #fff; background: var(--edge); border-radius: 8px; padding: 0 6px; }
  .tlabel.blink { animation: blink .7s 3; color: var(--accent); }
  .hopper { position: absolute; left: 0; width: var(--w); height: calc(var(--w) * .9); margin-left: calc(var(--w) * -.5); border-radius: 48% 48% 36% 36%;
    background: var(--c); box-shadow: inset 0 -6px 0 rgba(0,0,0,.2), inset 0 5px 0 rgba(255,255,255,.25); }
  .hopper .eye { top: 16%; } .hopper .mouth { bottom: 18%; }
  .food { position: absolute; transform: translate(-50%, 0); font-size: 40px; line-height: 1; transition: transform .3s, opacity .3s; }
  .food.eaten { transform: translate(-50%, 0) scale(0); opacity: 0; }
  .hopcount { position: absolute; transform: translateX(-50%); font-weight: 700; font-size: 20px; color: var(--accent); animation: pop .3s; }
  svg.arcs { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
  svg.arcs path { fill: none; stroke: var(--accent); stroke-width: 3; stroke-dasharray: 6 5; }
  svg.arcs path.ghost { stroke: #7fe3ff; }

  /* ---------- FIN ---------- */
  #end { align-items: center; justify-content: center; text-align: center; gap: 14px; padding: 20px; }
  #end h2 { font-family: 'Bangers', cursive; font-size: clamp(44px, 8vw, 72px); letter-spacing: 2px; color: var(--accent); }
  #stars { font-size: 64px; letter-spacing: 8px; }
  #stars .off { filter: grayscale(1) opacity(.3); }
  #endText { font-size: 22px; color: var(--muted); }
  .bigbtn { background: var(--accent); color: #3a2200; font-size: 24px; font-weight: 700; padding: 12px 26px; border-radius: 18px; box-shadow: 0 6px 0 #b3851e; margin: 6px; }
  .bigbtn.alt { background: #fff; color: #3b2a7a; box-shadow: 0 6px 0 #a99be0; }
  .confetti { position: fixed; top: -20px; width: 10px; height: 16px; z-index: 99; animation: fall linear forwards; pointer-events: none; }

  @keyframes crawl { 0%,100% { transform: translateY(0) scale(1, 1); } 50% { transform: translateY(calc(var(--s) * -.1)) scale(.96, 1.05); } }
  @keyframes drool { 0%,100% { scale: 1.06 .96; } 50% { scale: .97 1.05; } }
  @keyframes chew { 0%,100% { transform: scale(1, 1); } 50% { transform: scale(1.12, .86); } }
  @keyframes bubble { 0% { opacity: 0; translate: 0 10px; scale: .6; } 15% { opacity: 1; translate: 0 0; scale: 1.1; } 25% { scale: 1; } 80% { opacity: 1; } 100% { opacity: 0; translate: 0 -24px; } }
  @keyframes jolt { 0%,100% { translate: 0 0; } 20% { translate: -6px 4px; } 40% { translate: 5px -3px; } 60% { translate: -3px 2px; } 80% { translate: 2px -1px; } }
  @keyframes dizzy { 0%,100% { rotate: 0deg; } 25% { rotate: -14deg; } 75% { rotate: 14deg; } }
  .jolt { animation: jolt .25s; }
  .hopper { transform-origin: 50% 100%; }
  .hopper.dizzy { animation: dizzy .4s 3; }
  .streak { font-weight: 700; color: #ff9f1c; font-size: 20px; opacity: 0; transition: opacity .3s; }
  .streak.on { opacity: 1; animation: pop .4s; }
  @keyframes wiggle { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
  @keyframes bob { 0%,100% { transform: translateY(0) scale(1, 1); } 50% { transform: translateY(-5px) scale(1.02, .98); } }
  @keyframes look { 0%,40%,100% { transform: translateX(0); } 50%,90% { transform: translateX(60%); } }
  @keyframes pop { 0% { transform: scale(.6); } 60% { transform: scale(1.15); } 100% { transform: scale(1); } }
  @keyframes shake { 0%,100% { transform: translateX(0); } 20%,60% { transform: translateX(-10px); } 40%,80% { transform: translateX(10px); } }
  @keyframes blink { 50% { opacity: .2; } }
  @keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }
  @media (max-width: 600px) { .hud .title { display: none; } .badge { font-size: 24px; top: -42px; } }
</style>

<section id="menu" class="screen">
  <a class="back" href="../index.html">← Juegos</a>
  <h1>Monstruos Glotones</h1>

  <div class="menu-label">¿Con qué números?</div>
  <div class="ranges">
    <button class="range on" data-range="10">Hasta 10</button>
    <button class="range" data-range="a10">Amigos del 10</button>

    </button>
    <button class="gcard" data-game="eat">
      <div class="pic" id="picEat"></div>

    <button class="bigbtn" id="btnAgain">Otra vez</button>
    <button class="bigbtn alt" id="btnOther">Otro juego</button>
  </div>
</section>

<script>
const $ = s => document.querySelector(s);
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const sleep = ms => new Promise(r => setTimeout(r, ms));
const COLORS = ['#ff6b6b', '#ffb627', '#2ec4b6', '#8f7bff', '#ff7ac6', '#6bd14f', '#3fa9f5', '#ff8c42'];
const stage = $('#stage');

/* ---------- Sonido y voz ---------- */
let AC, NOISE, muted = false;
function ac() {
  if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
  if (AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(f, d = .12, type = 'sine', v = .15, delay = 0, slide) {
  if (muted) return;
  const c = ac(), t = c.currentTime + delay, o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + d);
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.001, t + d);
  o.connect(g).connect(c.destination); o.start(t); o.stop(t + d + .02);
}
function swoosh(len = .25) {
  if (muted) return;
  const c = ac();
  if (!NOISE) { NOISE = c.createBuffer(1, c.sampleRate * .3, c.sampleRate); const d = NOISE.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
  const s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain(), t = c.currentTime;
  s.buffer = NOISE; f.type = 'bandpass'; f.frequency.setValueAtTime(800, t); f.frequency.exponentialRampToValueAtTime(4000, t + len * .8);
  g.gain.setValueAtTime(.4, t); g.gain.exponentialRampToValueAtTime(.001, t + len);
  s.connect(f).connect(g).connect(c.destination); s.start(t);
}
const SFX = {

function planCut() {
  if (G.range === 'a10') {
    const xs = shuffle([1, 2, 3, 4, 6, 7, 8, 9]).slice(0, 4);
    return [{ mode: 'all', n: 10 }, ...xs.map(x => ({ mode: 'part', n: 10, x }))];
  }
  if (G.range === '10') {
    const alls = shuffle([5, 6, 7, 8, 9]).slice(0, 3).sort((a, b) => a - b).map(n => ({ mode: 'all', n }));
    const parts = [0, 1, 2].map(() => { const n = rnd(5, 10); return { mode: 'part', n, x: rnd(1, n - 1) }; });
    return [...alls, ...parts];
  }
  return [0, 1, 2, 3, 4, 5].map(i => { const n = rnd(11, 20); return { mode: 'part', n, x: i % 2 ? 10 : rnd(2, n - 2) }; });
}
let C = null;
function roundCut(r) {

  $('#prompt').innerHTML = r.mode === 'all'

    : `Parte al monstruo <b>${r.n}</b> para que un trozo sea <b>${r.x}</b>`;
  if (r.mode === 'all') $('#board').innerHTML = Array.from({ length: C.need }, () => '<span class="chip">? + ?</span>').join('');
  $('#controls').innerHTML = '<button class="hint" id="hintCut">💡 Pista</button>';

  placeWorm();
}

}

/* =========================================================
   JUEGO 2: GLOTONES (componer / amigos del número)
   ========================================================= */
function planEat() {
  const Ts = G.range === 'a10' ? [10, 10, 10, 10]
    : G.range === '10' ? shuffle([5, 6, 7, 8, 9, 10]).slice(0, 4).sort((a, b) => a - b)

}

    let a, tries = 0;
    do { a = rnd(1, T - 1); tries++; } while ((used.has(Math.min(a, T - a)) && tries < 20) || (T > 10 && (a > 15 || T - a > 15) && tries < 20));
    used.add(Math.min(a, T - a)); nums.push(a, T - a);
  }
  shuffle(nums);
  E = { T, left: nums.length };
  $('#board').innerHTML = Array.from({ length: pairsN }, () => '<span class="chip">? + ?</span>').join('');
  $('#prompt').innerHTML = `Junta dos monstruos que sumen <b>${T}</b>`;
  setMsg('Arrastra un monstruo encima de otro para que se lo coma 😋');
  const cols = W > 900 ? 4 : W > 520 ? 3 : 2, rows = Math.ceil(nums.length / cols);
  const cw = W / cols, ch = H / rows, d = Math.max(9, Math.min(18, cw / 10, ch / 9));

  nums.forEach((n, i) => {
    const b = buildBlob(n, COLORS[i % COLORS.length], d);

/* =========================================================
   JUEGO 3: SALTAMONSTRUOS (¿cuánto hay de … a …?)
   ========================================================= */
function planJump() {
  const out = [], seen = new Set();
  while (out.length < 8) {
    let a, b, max = G.range === '20' ? 20 : 10;
    if (G.range === 'a10') { a = rnd(0, 9); b = 10; if (out.length > 4) { a = 10; b = rnd(11, 20); max = 20; } }
    else if (G.range === '10') { a = rnd(0, 10); b = rnd(0, 10); if (Math.random() < .65 && a > b) [a, b] = [b, a]; }
    else if (Math.random() < .6) { a = rnd(3, 9); b = rnd(11, 18); if (Math.random() < .3) [a, b] = [b, a]; }
    else { a = rnd(0, 20); b = rnd(0, 20); if (Math.random() < .65 && a > b) [a, b] = [b, a]; }
    const key = a + '-' + b;
    if (a === b || seen.has(key) || Math.abs(a - b) > 12) continue;
    seen.add(key); out.push({ a, b, max });
  }
  return out;
}
let J = null;
function roundJump(r) {
  J = { ...r, pos: r.a, color: pick(COLORS) };
  const d = Math.abs(r.b - r.a), back = r.b < r.a;
  $('#prompt').innerHTML = `¿Cuánto salta ${back ? '<u>hacia atrás</u> ' : ''}del <b>${r.a}</b> al <b>${r.b}</b>?`;
  setMsg('');
  const opts = new Set([d]);
  [d - 1, d + 1, d - 2, d + 2, 10 - d].forEach(v => { if (opts.size < 4 && v >= 1 && v <= r.max && !opts.has(v)) opts.add(v); });
  while (opts.size < 4) opts.add(rnd(1, Math.min(12, r.max)));
  $('#controls').innerHTML = shuffle([...opts]).map(v => `<button class="opt" data-v="${v}">${v}</button>`).join('') + '<button class="hint" id="hintJump">💡 Pista</button>';
  $('#controls').querySelectorAll('.opt').forEach(btn => btn.onclick = () => chooseJump(+btn.dataset.v, btn));
  $('#hintJump').onclick = hintJump;
  layoutLine();
}
function lineGeo() {
  const W = stage.clientWidth, H = stage.clientHeight, pad = Math.max(24, W * .05);
  const step = (W - 2 * pad) / J.max, y = Math.min(H * .72, H - 60);

}

  const line = document.createElement('div'); line.className = 'nline';
  line.style.left = g.pad - 6 + 'px'; line.style.width = g.W - 2 * g.pad + 12 + 'px'; line.style.top = g.y - 3 + 'px';
  stage.appendChild(line);
  for (let i = 0; i <= J.max; i++) {
    const t = document.createElement('div'); t.className = 'tick' + (i === 10 ? ' ten' : '');
    t.style.left = g.x(i) + 'px'; t.style.top = g.y - (i === 10 ? 15 : 10) + 'px'; stage.appendChild(t);
    const l = document.createElement('div'); l.className = 'tlabel' + (i === 10 ? ' ten' : '') + (i === J.a ? ' from' : '');
    l.dataset.i = i; l.textContent = i; l.style.left = g.x(i) + 'px'; l.style.top = g.y + 18 + 'px';

    { transform: `translateX(${xm}px) translateY(${-hh}px) scale(.86, 1.18)`, offset: .58 },
    { transform: `translateX(${x1}px) translateY(0) scale(1.28, .74)`, offset: .86 },

async function chooseJump(v, btn) {

    burst(g.x(b), g.y - 50, { n: 18, kind: 'star', color: ['#ffd23f', '#fff', J.color], speed: 7, size: 8, grav: .12, life: 55, up: 2 });

  J.hopper.classList.add('dizzy'); bubble(g.x(pos), g.y - J.hopper.offsetHeight - 14, short ? '¡Me falta!' : '¡Me pasé!');
  setMsg(`${eqHTML(eq)} ${short ? `¡Te faltan ${diff}!` : `¡Te has pasado ${diff}!`}`, 'bad');
  await sleep(1500);
  J.hopper.classList.remove('dizzy'); SFX.boing();
  await J.hopper.animate([
    { transform: `translateX(${g.x(pos)}px) translateY(0)` },
    { transform: `translateX(${(g.x(pos) + g.x(a)) / 2}px) translateY(-90px)` },
