<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Juegos educativos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fff8ec;
    --ink: #2b2140;
    --muted: #6b6280;
    --card: #ffffff;
    --line: #efe3cf;
    --mate: #2f80ed;
    --lengua: #e0457b;
    --sociales: #1f9d6a;
    --ingles: #6c4ce0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: 'Fredoka', 'Segoe UI', sans-serif; color: var(--ink);
    background: var(--bg);
    background-image: radial-gradient(circle at 10% 0%, #ffe3b3 0, transparent 40%), radial-gradient(circle at 100% 20%, #d9ecff 0, transparent 35%);
    min-height: 100vh;
  }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 32px 16px 48px; }
  header { text-align: center; margin-bottom: 24px; }
  header .logo { width: 72px; height: 72px; margin: 0 auto; border-radius: 22px; display: grid; place-items: center; color: #fff; background: linear-gradient(135deg, #ff9f1c, #e0457b); box-shadow: 0 8px 20px rgba(224, 69, 123, .3); }
  header .logo svg { width: 40px; height: 40px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  h1 { margin: 8px 0 4px; font-size: clamp(32px, 6vw, 52px); font-weight: 700; letter-spacing: -0.5px; }
  header p { margin: 0; color: var(--muted); font-size: 18px; }

  .filters { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin: 22px 0 8px; }
  .chip {
    border: 2px solid var(--line); background: #fff; color: var(--ink); border-radius: 999px;
    padding: 8px 16px; font: 600 15px 'Fredoka', sans-serif; cursor: pointer;
  }
  .chip.on { background: var(--ink); color: #fff; border-color: var(--ink); }

  section { margin-top: 32px; }
  .level-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; border-bottom: 3px dashed var(--line); padding-bottom: 8px; margin-bottom: 16px; }
  .level-head h2 { margin: 0; font-size: 28px; }
  .level-head span { color: var(--muted); font-size: 16px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
  .card {
    position: relative; display: flex; flex-direction: column; gap: 8px; overflow: hidden;
    background: var(--card); border: 2px solid var(--line); border-radius: 20px; padding: 0 18px 18px;
    text-decoration: none; color: inherit;
    box-shadow: 0 4px 0 var(--line);
    transition: transform .15s, box-shadow .15s, border-color .15s;
  }
  .card:hover, .card:focus-visible { transform: translateY(-4px); box-shadow: 0 8px 0 var(--line); border-color: var(--c); outline: none; }
  .card .shot { margin: 0 -18px; aspect-ratio: 16 / 10; background: #eee; border-bottom: 2px solid var(--line); overflow: hidden; }
  .card .shot img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; transition: transform .3s; }
  .card:hover .shot img { transform: scale(1.05); }
  .card .emoji { margin-top: -30px; position: relative; border: 3px solid #fff; width: 56px; height: 56px; border-radius: 16px; display: grid; place-items: center; color: var(--c); background: color-mix(in srgb, var(--c) 14%, white); }
  .card .emoji svg { width: 28px; height: 28px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .card h3 { margin: 4px 0 0; font-size: 20px; }
  .card p { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.35; flex: 1; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
  .tag { font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px; background: #f4efe6; color: var(--muted); }
  .tag.subj { background: var(--c); color: #fff; }
  .mate { --c: var(--mate); }
  .lengua { --c: var(--lengua); }
  .sociales { --c: var(--sociales); }
  .ingles { --c: var(--ingles); }
  .empty { color: var(--muted); font-style: italic; }
  footer { text-align: center; color: var(--muted); font-size: 14px; margin-top: 48px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo"><svg viewBox="0 0 24 24" aria-hidden="true"><line x1="6" x2="10" y1="11" y2="11"/><line x1="8" x2="8" y1="9" y2="13"/><line x1="15" x2="15.01" y1="12" y2="12"/><line x1="18" x2="18.01" y1="10" y2="10"/><path d="M17.32 5H6.68a4 4 0 0 0-3.98 3.59C2.6 9.42 2 14.46 2 16a3 3 0 0 0 3 3c1 0 1.5-.5 2-1l1.41-1.41A2 2 0 0 1 9.83 16h4.34a2 2 0 0 1 1.41.59L17 18c.5.5 1 1 2 1a3 3 0 0 0 3-3c0-1.55-.6-6.58-.69-7.26A4 4 0 0 0 17.32 5z"/></svg></div>
    <h1>Juegos educativos</h1>
    <p>Aprende jugando: elige tu nivel y ¡a por ello!</p>
    <nav class="filters" id="filters" aria-label="Filtrar por asignatura"></nav>
  </header>
  <main id="levels"></main>
  <footer>Hecho con cariño para el aula</footer>
</div>

<script>
// Para añadir un juego nuevo, basta con añadir una línea aquí.
const ICONS = {
  clock: '<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>',
  mountain: '<path d="m8 3 4 8 5-5 5 15H2L8 3z"/>',
  apple: '<path d="M12 20.94c1.5 0 2.75 1.06 4 1.06 3 0 6-8 6-12.22A4.91 4.91 0 0 0 17 5c-2.22 0-4 1.44-5 2-1-.56-2.78-2-5-2a4.9 4.9 0 0 0-5 4.78C2 14 5 22 8 22c1.25 0 2.5-1.06 4-1.06Z"/><path d="M10 2c1 .5 2 2 2 5"/>',
  camera: '<path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/>',
  book: '<path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>',
  scissors: '<circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><line x1="20" y1="4" x2="8.12" y2="15.88"/><line x1="14.47" y1="14.48" x2="20" y2="20"/><line x1="8.12" y1="8.12" x2="12" y2="12"/>',
  pen: '<path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/><path d="m15 5 4 4"/>',
  crosshair: '<circle cx="12" cy="12" r="10"/><line x1="22" y1="12" x2="18" y2="12"/><line x1="6" y1="12" x2="2" y2="12"/><line x1="12" y1="6" x2="12" y2="2"/><line x1="12" y1="22" x2="12" y2="18"/>',
  target: '<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>',
  run: '<circle cx="13" cy="4" r="2"/><path d="m4 22 4-7 3 2 2-5 4 3h3"/><path d="m9 10 3-3 3 2"/>',
  search: '<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
};
const SUBJECTS = {
  mate: 'Matemáticas',
  lengua: 'Lengua',
  sociales: 'Ciencias Sociales',
  ingles: 'Inglés',
};
const LEVELS = [
  { id: 1, name: 'Primer ciclo', courses: '1º y 2º de Primaria' },
  { id: 2, name: 'Segundo ciclo', courses: '3º y 4º de Primaria' },
  { id: 3, name: 'Tercer ciclo', courses: '5º y 6º de Primaria' },
];
const GAMES = [
  { level: 1, subj: 'mate', icon: 'clock', title: 'Reloj Maestro', desc: 'Aprende a leer la hora en relojes de agujas y digitales.', course: '1º – 2º', href: 'matematicas/reloj.html', img: 'img/capturas/reloj.jpg' },
  { level: 1, subj: 'sociales', icon: 'mountain', title: 'Paisajes naturales vs humanizados', desc: 'Observa fotos reales y decide si el ser humano ha cambiado el paisaje.', course: '1º – 2º', href: 'naturalVShumanizado/index.html', img: 'img/capturas/paisajes.jpg' },

  { level: 2, subj: 'mate', icon: 'apple', title: 'Fruta Ninja', desc: 'Corta la fruta con el resultado correcto de la tabla de multiplicar.', course: '2º – 4º', href: 'matematicas/fruta-ninja.html', img: 'img/capturas/fruta-ninja.jpg', extra: 'Táctil' },
  { level: 2, subj: 'mate', icon: 'camera', title: 'Ninja Multiplicator', desc: 'Practica las tablas moviendo el cuerpo delante de la cámara.', course: '2º – 4º', href: 'matematicas/ninja-multiplicator.html', img: 'img/capturas/ninja-multiplicator.jpg', extra: 'Con cámara' },
  { level: 2, subj: 'lengua', icon: 'book', title: 'Detectives del Diccionario', desc: 'Busca el significado correcto de cada palabra según la frase.', course: '3º', href: 'lengua/diccionario.html', img: 'img/capturas/diccionario.jpg' },
  { level: 2, subj: 'lengua', icon: 'scissors', title: 'Detective de Sílabas', desc: 'Separa en sílabas y encuentra la sílaba tónica de cada palabra.', course: '3º – 4º', href: 'lengua/tonicasyatonas.html', img: 'img/capturas/silabas.jpg' },
  { level: 2, subj: 'lengua', icon: 'pen', title: 'Detective de Acentos', desc: 'Agudas, llanas y esdrújulas: ¿lleva tilde o no?', course: '3º – 4º', href: 'lengua/acentuacion.html', img: 'img/capturas/acentos.jpg' },
  { level: 2, subj: 'ingles', icon: 'run', title: 'To Be Runner', desc: 'Corre por el carril correcto: am, is, are, was, were… ¡sin fallar!', course: '3º – 6º', href: 'ingles/to-be-runner.html', img: 'img/capturas/to-be-runner.jpg', extra: 'Táctil' },
  { level: 2, subj: 'lengua', icon: 'crosshair', title: 'El Caza-Determinantes', desc: 'Encuentra y clasifica los determinantes de cada oración.', course: '4º', href: 'lengua/cazadeterminantes.html', img: 'img/capturas/determinantes.jpg' },

  { level: 3, subj: 'lengua', icon: 'target', title: 'El Caza-Adverbios', desc: 'Encuentra el adverbio en cada oración y clasifícalo.', course: '5º – 6º', href: 'lengua/cazaadverbios.html', img: 'img/capturas/adverbios.jpg' },
  { level: 3, subj: 'lengua', icon: 'search', title: 'Detective de Sujeto y Predicado', desc: 'Subraya el sujeto y el predicado de cada oración.', course: '5º – 6º', href: 'lengua/sujetoypredicado.html', img: 'img/capturas/sujeto-predicado.jpg' },
];

let filter = 'todas';

function renderFilters() {
  const opts = [['todas', 'Todas'], ...Object.entries(SUBJECTS)];
  const nav = document.getElementById('filters');
  nav.innerHTML = '';
  for (const [id, label] of opts) {
    const b = document.createElement('button');
    b.className = 'chip' + (filter === id ? ' on' : '');
    b.textContent = label;
    b.onclick = () => { filter = id; renderFilters(); renderLevels(); };
    nav.appendChild(b);
  }
}

function renderLevels() {
  const main = document.getElementById('levels');
  main.innerHTML = '';
  for (const lv of LEVELS) {
    const games = GAMES.filter(g => g.level === lv.id && (filter === 'todas' || g.subj === filter));
    const sec = document.createElement('section');
    sec.innerHTML = `<div class="level-head"><h2>${lv.name}</h2><span>${lv.courses}</span></div>`;
    const grid = document.createElement('div');
    grid.className = 'grid';
    if (!games.length) grid.innerHTML = '<p class="empty">Pronto habrá juegos aquí.</p>';
    for (const g of games) {
      const a = document.createElement('a');
      a.className = 'card ' + g.subj;
      a.href = g.href;
      a.innerHTML = `
        <div class="shot"><img src="${g.img}" alt="Captura de ${g.title}" loading="lazy"></div>
        <div class="emoji"><svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[g.icon]}</svg></div>
        <h3>${g.title}</h3>
        <p>${g.desc}</p>
        <div class="tags">
          <span class="tag subj">${SUBJECTS[g.subj]}</span>
          <span class="tag">${g.course}</span>
          ${g.extra ? `<span class="tag">${g.extra}</span>` : ''}
        </div>`;
      grid.appendChild(a);
    }
    sec.appendChild(grid);
    main.appendChild(sec);
  }
}

renderFilters();
renderLevels();
</script>
</body>
</html>
