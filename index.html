<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Juegos educativos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fff8ec;
    --ink: #2b2140;
    --muted: #6b6280;
    --card: #ffffff;
    --line: #efe3cf;
    --mate: #2f80ed;
    --lengua: #e0457b;
    --sociales: #1f9d6a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: 'Fredoka', 'Segoe UI', sans-serif; color: var(--ink);
    background: var(--bg);
    background-image: radial-gradient(circle at 10% 0%, #ffe3b3 0, transparent 40%), radial-gradient(circle at 100% 20%, #d9ecff 0, transparent 35%);
    min-height: 100vh;
  }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 32px 16px 48px; }
  header { text-align: center; margin-bottom: 24px; }
  header .logo { font-size: 52px; line-height: 1; }
  h1 { margin: 8px 0 4px; font-size: clamp(32px, 6vw, 52px); font-weight: 700; letter-spacing: -0.5px; }
  header p { margin: 0; color: var(--muted); font-size: 18px; }

  .filters { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin: 22px 0 8px; }
  .chip {
    border: 2px solid var(--line); background: #fff; color: var(--ink); border-radius: 999px;
    padding: 8px 16px; font: 600 15px 'Fredoka', sans-serif; cursor: pointer;
  }
  .chip.on { background: var(--ink); color: #fff; border-color: var(--ink); }

  section { margin-top: 32px; }
  .level-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; border-bottom: 3px dashed var(--line); padding-bottom: 8px; margin-bottom: 16px; }
  .level-head h2 { margin: 0; font-size: 28px; }
  .level-head span { color: var(--muted); font-size: 16px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
  .card {
    position: relative; display: flex; flex-direction: column; gap: 8px;
    background: var(--card); border: 2px solid var(--line); border-radius: 20px; padding: 18px;
    text-decoration: none; color: inherit;
    box-shadow: 0 4px 0 var(--line);
    transition: transform .15s, box-shadow .15s, border-color .15s;
  }
  .card:hover, .card:focus-visible { transform: translateY(-4px); box-shadow: 0 8px 0 var(--line); border-color: var(--c); outline: none; }
  .card .emoji { width: 56px; height: 56px; border-radius: 16px; display: grid; place-items: center; font-size: 30px; background: color-mix(in srgb, var(--c) 14%, white); }
  .card h3 { margin: 4px 0 0; font-size: 20px; }
  .card p { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.35; flex: 1; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
  .tag { font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px; background: #f4efe6; color: var(--muted); }
  .tag.subj { background: var(--c); color: #fff; }
  .mate { --c: var(--mate); }
  .lengua { --c: var(--lengua); }
  .sociales { --c: var(--sociales); }
  .empty { color: var(--muted); font-style: italic; }
  footer { text-align: center; color: var(--muted); font-size: 14px; margin-top: 48px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">🎮</div>
    <h1>Juegos educativos</h1>
    <p>Aprende jugando: elige tu nivel y ¡a por ello!</p>
    <nav class="filters" id="filters" aria-label="Filtrar por asignatura"></nav>
  </header>
  <main id="levels"></main>
  <footer>Hecho con cariño para el aula ✏️</footer>
</div>

<script>
// Para añadir un juego nuevo, basta con añadir una línea aquí.
const SUBJECTS = {
  mate: 'Matemáticas',
  lengua: 'Lengua',
  sociales: 'Ciencias Sociales',
};
const LEVELS = [
  { id: 1, name: 'Primer ciclo', courses: '1º y 2º de Primaria' },
  { id: 2, name: 'Segundo ciclo', courses: '3º y 4º de Primaria' },
  { id: 3, name: 'Tercer ciclo', courses: '5º y 6º de Primaria' },
];
const GAMES = [
  { level: 1, subj: 'mate', emoji: '🕒', title: 'Reloj Maestro', desc: 'Aprende a leer la hora en relojes de agujas y digitales.', course: '1º – 2º', href: 'matematicas/reloj.html' },
  { level: 1, subj: 'sociales', emoji: '🏞️', title: 'Paisajes naturales vs humanizados', desc: 'Observa fotos reales y decide si el ser humano ha cambiado el paisaje.', course: '1º – 2º', href: 'naturalVShumanizado/index.html' },

  { level: 2, subj: 'mate', emoji: '🍉', title: 'Fruta Ninja', desc: 'Corta la fruta con el resultado correcto de la tabla de multiplicar.', course: '2º – 4º', href: 'matematicas/fruta-ninja.html', extra: 'Táctil' },
  { level: 2, subj: 'mate', emoji: '🥷', title: 'Ninja Multiplicator', desc: 'Practica las tablas moviendo el cuerpo delante de la cámara.', course: '2º – 4º', href: 'matematicas/ninja-multiplicator.html', extra: 'Con cámara' },
  { level: 2, subj: 'lengua', emoji: '📖', title: 'Detectives del Diccionario', desc: 'Busca el significado correcto de cada palabra según la frase.', course: '3º', href: 'lengua/diccionario.html' },
  { level: 2, subj: 'lengua', emoji: '🚂', title: 'Detective de Sílabas', desc: 'Separa en sílabas y encuentra la sílaba tónica de cada palabra.', course: '3º – 4º', href: 'lengua/tonicasyatonas.html' },
  { level: 2, subj: 'lengua', emoji: '✍️', title: 'Detective de Acentos', desc: 'Agudas, llanas y esdrújulas: ¿lleva tilde o no?', course: '3º – 4º', href: 'lengua/acentuacion.html' },
  { level: 2, subj: 'lengua', emoji: '🎯', title: 'El Caza-Determinantes', desc: 'Encuentra y clasifica los determinantes de cada oración.', course: '4º', href: 'lengua/cazadeterminantes.html' },

  { level: 3, subj: 'lengua', emoji: '🏹', title: 'El Caza-Adverbios', desc: 'Encuentra el adverbio en cada oración y clasifícalo.', course: '5º – 6º', href: 'lengua/cazaadverbios.html' },
  { level: 3, subj: 'lengua', emoji: '🔍', title: 'Detective de Sujeto y Predicado', desc: 'Subraya el sujeto y el predicado de cada oración.', course: '5º – 6º', href: 'lengua/sujetoypredicado.html' },
];

let filter = 'todas';

function renderFilters() {
  const opts = [['todas', 'Todas'], ...Object.entries(SUBJECTS)];
  const nav = document.getElementById('filters');
  nav.innerHTML = '';
  for (const [id, label] of opts) {
    const b = document.createElement('button');
    b.className = 'chip' + (filter === id ? ' on' : '');
    b.textContent = label;
    b.onclick = () => { filter = id; renderFilters(); renderLevels(); };
    nav.appendChild(b);
  }
}

function renderLevels() {
  const main = document.getElementById('levels');
  main.innerHTML = '';
  for (const lv of LEVELS) {
    const games = GAMES.filter(g => g.level === lv.id && (filter === 'todas' || g.subj === filter));
    const sec = document.createElement('section');
    sec.innerHTML = `<div class="level-head"><h2>${lv.name}</h2><span>${lv.courses}</span></div>`;
    const grid = document.createElement('div');
    grid.className = 'grid';
    if (!games.length) grid.innerHTML = '<p class="empty">Pronto habrá juegos aquí.</p>';
    for (const g of games) {
      const a = document.createElement('a');
      a.className = 'card ' + g.subj;
      a.href = g.href;
      a.innerHTML = `
        <div class="emoji">${g.emoji}</div>
        <h3>${g.title}</h3>
        <p>${g.desc}</p>
        <div class="tags">
          <span class="tag subj">${SUBJECTS[g.subj]}</span>
          <span class="tag">${g.course}</span>
          ${g.extra ? `<span class="tag">${g.extra}</span>` : ''}
        </div>`;
      grid.appendChild(a);
    }
    sec.appendChild(grid);
    main.appendChild(sec);
  }
}

renderFilters();
renderLevels();
</script>
</body>
</html>
